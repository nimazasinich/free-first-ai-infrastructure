name: Verify gateway

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m compileall -q bridge scripts tests
      - run: python3 -m unittest discover -s tests -v
      - run: node --check tests/router-fault.cjs
      - run: node --check tests/router-recovery.cjs
